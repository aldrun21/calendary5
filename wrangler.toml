# Configuration for Cloudflare Pages with KV bindings
name = "calendary4"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"
main = "src/worker.ts"

[assets]
directory = "./dist"

[[kv_namespaces]]
binding = "DERM_STORE"
